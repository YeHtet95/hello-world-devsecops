# Accepted Trivy findings, with the reason and an expiry date.
#
# The point of the expiry is that acceptance is temporary by default. An
# entry that lapses reappears in the Security tab.
#
# Findings that can be *fixed* are fixed rather than listed here — see
# KSV-0020/KSV-0021 in k8s/deployment.yaml, which were resolved by moving
# the workload to UID 10101 instead of being suppressed.

# NOTE: `paths` are relative to the scan root passed to Trivy (k8s/),
# not to the repository root.

misconfigurations:
  - id: KSV-0013
    paths: ["deployment.yaml"]
    statement: >-
      "should specify an image tag" — the manifest deliberately pins by
      SHA256 digest instead, which is strictly stronger: a tag can be
      repointed to different content after CI has scanned it, a digest
      cannot. The check penalises the more secure choice. Accepted
      indefinitely in practice; dated so it is re-reviewed if the rule's
      semantics change.
    expired_at: 2027-03-31

  - id: KSV-0125
    paths: ["deployment.yaml"]
    statement: >-
      "image from an untrusted registry" — ghcr.io is not in Trivy's default
      trusted-registry list. It is this project's own registry, the image is
      built by this repository's pipeline and pinned by digest. The correct
      long-term fix is to configure the trusted registry list; doing that
      properly belongs with the AKS/ACR work, where the registry would be
      ACR.
    expired_at: 2027-03-31

  - id: KSV-0125
    paths: ["oauth2-proxy.yaml"]
    statement: >-
      Same rule, a different registry and a different reason. quay.io is not
      ours — it is oauth2-proxy's own official publisher, which is *why* it
      is trusted here: pulling from the project's own registry, pinned by
      digest, is more traceable than re-hosting a copy ourselves would be.
      This file was added after the ghcr.io exception above was written and
      was not covered by it — the gate correctly caught an untriaged
      manifest rather than a real regression. The same long-term fix
      applies: configure the trust list explicitly instead of accepting
      registry-by-registry.
    expired_at: 2027-03-31
