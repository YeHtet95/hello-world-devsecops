apiVersion: v1
kind: ServiceAccount
metadata:
  name: hello-world
  namespace: hello-world
# The workload serves a static file. It has no reason to talk to the
# Kubernetes API, so it gets no token mounted at all.
#
# The default is the opposite: every pod gets a ServiceAccount token
# projected into it, so a compromised container starts with a credential and
# a route to the API server. Turning this off costs nothing here and removes
# the first thing an attacker inside the container would reach for.
#
# This ServiceAccount also has no RoleBinding anywhere — even if a token
# were somehow obtained, it authorises nothing.
automountServiceAccountToken: false
