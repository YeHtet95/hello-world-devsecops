apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hello-world
  namespace: hello-world
  annotations:
    # Redirect HTTP to HTTPS.
    #
    # `force-ssl-redirect` rather than `ssl-redirect`: the latter is a no-op
    # unless the Ingress declares a `tls:` block for the host, which this one
    # deliberately does not — the demo relies on ingress-nginx's self-signed
    # default certificate. Using the plain `ssl-redirect` annotation here
    # silently serves plaintext
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"

    # Authentication, enforced here rather than in the application.
    #
    # ingress-nginx calls auth-url as a subrequest before proxying. If
    # oauth2-proxy returns 401 the request is never forwarded to the nginx
    # pod, and the visitor is redirected to auth-signin instead. The static
    # page therefore contains no auth code at all — the thing serving
    # content is not the thing deciding who may see it.
    #
    # auth-url is the in-cluster Service address, so this subrequest never
    # leaves the cluster and does not depend on external DNS.
    nginx.ingress.kubernetes.io/auth-url: "http://oauth2-proxy.hello-world.svc.cluster.local:4180/oauth2/auth"
    # auth-signin is a browser-facing redirect, so it must be an address the
    # browser can reach — including the :8443 host port kind maps.
    # $escaped_request_uri preserves the originally requested path.
    nginx.ingress.kubernetes.io/auth-signin: "https://$host:8443/oauth2/start?rd=$escaped_request_uri"
spec:
  # Set explicitly. The controller is configured with
  # watchIngressWithoutClass: false
  ingressClassName: nginx
  rules:
    # nip.io resolves *.127.0.0.1.nip.io to 127.0.0.1 with no hosts-file
    # entry or DNS setup. Certificates and DNS are out of scope per the brief.
    - host: hello.127.0.0.1.nip.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: hello-world
                port:
                  name: http
