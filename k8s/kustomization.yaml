apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: hello-world

resources:
  - namespace.yaml
  - serviceaccount.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
  - networkpolicy.yaml

# This is the handoff point between CI and the cluster.
#
# The pipeline does not deploy. It builds the image, scans it, pushes it to
# GHCR, then rewrites the digest below and commits. Argo CD notices the
# commit and reconciles the cluster to match. The pipeline therefore never
# holds a cluster credential
images:
  - name: ghcr.io/yehtet95/hello-world-devsecops
    # The pipeline rewrites the digest line below after a successful build and
    # scan, then commits. Argo CD sees the commit and reconciles. The literal
    # string `digest: ` at this indent is the rewrite marker — see
    # .github/workflows/build-scan-publish.yml.
    #
    # Placeholder until the first pipeline run publishes a real image.
    digest: sha256:68d29c869af5aa250c982bfc5b2da74e61e380adcd21c068ce3ed46bfdf2d26f
